<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Interview Drill Coach</title><desc id="desc">A single-agent loop connected to local notes and persistent progress.</desc>
