<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<circle cx="1450" cy="60" r="280" fill="#78ddc9" opacity=".07"/>
<text x="90" y="105" fill="#78ddc9" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">PROJECT ARCHITECTURE</text>
<text x="90" y="175" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="52" font-weight="700">Interview Drill Coach</text>
<text x="90" y="222" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="24">A single-agent loop connected to local notes and persistent progress.</text><line x1="340" y1="395" x2="420" y2="315" stroke="#78ddc9" stroke-width="4" marker-end="url(#arrow)" opacity=".85"/><line x1="340" y1="395" x2="420" y2="565" stroke="#78ddc9" stroke-width="4" marker-end="url(#arrow)" opacity=".85"/><line x1="680" y1="315" x2="760" y2="375" stroke="#78ddc9" stroke-width="4" marker-end="url(#arrow)" opacity=".85"/><rect x="655.0" y="328.0" width="130" height="34" rx="17" fill="#09111f" stroke="#284257"/><text x="720.0" y="352.0" text-anchor="middle" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="16">history</text><line x1="680" y1="565" x2="760" y2="425" stroke="#78ddc9" stroke-width="4" marker-end="url(#arrow)" opacity=".85"/><rect x="655.0" y="478.0" width="130" height="34" rx="17" fill="#09111f" stroke="#284257"/><text x="720.0" y="502.0" text-anchor="middle" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="16">context</text><line x1="1010" y1="395" x2="1080" y2="315" stroke="#78ddc9" stroke-width="4" marker-end="url(#arrow)" opacity=".85"/><rect x="980.0" y="338.0" width="130" height="34" rx="17" fill="#09111f" stroke="#284257"/><text x="1045.0" y="362.0" text-anchor="middle" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="16">ask</text><line x1="1205" y1="380" x2="1205" y2="500" stroke="#78ddc9" stroke-width="4" marker-end="url(#arrow)" opacity=".85"/><rect x="1140.0" y="423.0" width="130" height="34" rx="17" fill="#09111f" stroke="#284257"/><text x="1205.0" y="447.0" text-anchor="middle" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="16">answer</text><line x1="1330" y1="565" x2="1390" y2="425" stroke="#78ddc9" stroke-width="4" marker-end="url(#arrow)" opacity=".85"/><rect x="1295.0" y="478.0" width="130" height="34" rx="17" fill="#09111f" stroke="#284257"/><text x="1360.0" y="502.0" text-anchor="middle" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="16">end</text><line x1="1080" y1="565" x2="1010" y2="425" stroke="#78ddc9" stroke-width="4" marker-end="url(#arrow)" opacity=".85"/><rect x="980.0" y="478.0" width="130" height="34" rx="17" fill="#09111f" stroke="#284257"/><text x="1045.0" y="502.0" text-anchor="middle" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="16">adapt</text><g filter="url(#shadow)"><rect x="90" y="330" width="250" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="90" y="330" width="8" height="130" rx="4" fill="#78ddc9"/><text x="122" y="378" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">Session request</text><text x="122" y="412" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="17">Topic + difficulty + count</text></g><g filter="url(#shadow)"><rect x="420" y="250" width="260" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="420" y="250" width="8" height="130" rx="4" fill="#78ddc9"/><text x="452" y="298" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">Progress tool</text><text x="452" y="332" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="17">Read weak topics</text></g><g filter="url(#shadow)"><rect x="420" y="500" width="260" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="420" y="500" width="8" height="130" rx="4" fill="#78ddc9"/><text x="452" y="548" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">Notes tool</text><text x="452" y="582" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="17">Retrieve local context</text></g><g filter="url(#shadow)"><rect x="760" y="330" width="250" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="760" y="330" width="8" height="130" rx="4" fill="#78ddc9"/><text x="792" y="378" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">Question agent</text><text x="792" y="412" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="17">Generate grounded prompt</text></g><g filter="url(#shadow)"><rect x="1080" y="250" width="250" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="1080" y="250" width="8" height="130" rx="4" fill="#78ddc9"/><text x="1112" y="298" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">User answer</text><text x="1112" y="332" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="17">One response at a time</text></g><g filter="url(#shadow)"><rect x="1080" y="500" width="250" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="1080" y="500" width="8" height="130" rx="4" fill="#78ddc9"/><text x="1112" y="548" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">Evaluation</text><text x="1112" y="582" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="17">Structured 1–5 score</text></g><g filter="url(#shadow)"><rect x="1390" y="330" width="150" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="1390" y="330" width="8" height="130" rx="4" fill="#78ddc9"/><text x="1422" y="378" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">Report</text><text x="1422" y="412" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="17">Save + finish</text></g><text x="90" y="840" fill="#748198" font-family="Arial,sans-serif" font-size="19">Guardrail: never invent experience; source project-specific questions from retrieved notes.</text></svg>