" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="80" y="340" width="8" height="130" rx="4" fill="#78ddc9"/><text x="112" y="388" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">React client</text><text x="112" y="422" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="17">Search + geolocation</text></g><g filter="url(#shadow)"><rect x="400" y="340" width="250" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="400" y="340" width="8" height="130" rx="4" fill="#78ddc9"/><text x="432" y="388" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">FastAPI routes</text><text x="432" y="422" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="17">Validation + HTTP API</text></g><g filter="url(#shadow)"><rect x="720" y="240" width="250" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="720" y="240" width="8" height="130" rx="4" fill="#78ddc9"/><text x="752" y="288" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">Weather service</text><text x="752" y="322" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="17">External API orchestration</text></g><g filter="url(#shadow)"><rect x="720" y="500" width="250" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="720" y="500" width="8" height="130" rx="4" fill="#78ddc9"/><text x="752" y="548" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">Record service</text><text x="752" y="582" fill="#aeb8c9" font-family="Arial,sans-serif" font-size="17">CRUD + business logic</text></g><g filter="url(#shadow)"><rect x="1040" y="240" width="250" height="130" rx="22" fill="#16243a" stroke="#36556a" stroke-width="2"/><rect x="1040" y="240" width="8" height="130" rx="4" fill="#78ddc9"/><text x="1072" y="288" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">Redis cache</