run: docker compose up --build
seed: docker compose exec api python -m app.scripts.seed
test: docker compose exec api pytest -q
base_url: http://localhost:8000
endpoints:
  health: /health
  create_widget: /api/v1/widgets
  widget_config: /public/v1/widgets/{public_id}/config
  submission: /public/v1/widgets/{public_id}/submissions
